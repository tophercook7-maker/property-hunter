name: Refresh State Lands inventory

# Rebuilds docs/data/state_lands.json from the public COSL auction feed and the
# State parcel layer, then commits it so the GitHub Pages site stays current.
# Public data only; no logins, no bidding, polite pacing.

# 2026-09-23: the scheduled runs failed every day from 09-20 (COSL does not answer GitHub's runners; exit 1).
# The Mac's publish loop (tools/publish_scan.py) now refreshes the inventory once a day instead. Kept for
# manual runs only; re-add the schedule if COSL starts answering the runner again.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx xlrd
      - run: python3 tools/build_state_lands.py --details
      - name: Sales history (Mondays, or when run by hand)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 11 * * 1'
        run: python3 tools/build_cosl_history.py
      - run: python3 tools/build_radar.py
      - name: Commit if changed
        run: |
          git config user.name "property-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/state_lands.json docs/data/cosl_history.json docs/data/history docs/data/radar.json docs/data/radar
          git diff --cached --quiet || git commit -m "State Lands inventory refresh $(date -u +%F)"
          git push
