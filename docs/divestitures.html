<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Big land on the move · Property Hunter</title>
<meta name="description" content="Parcels leaving Arkansas' largest institutional landowners — timber companies, utilities and public agencies. A parcel that has just left a timber REIT is on the market before it is listed anywhere.">
<meta property="og:title" content="Big land on the move · Property Hunter">
<meta property="og:description" content="3.6 million Arkansas acres watched for parcels changing hands out of institutional ownership.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tophercook7-maker.github.io/property-hunter/divestitures.html">
<meta property="og:image" content="https://tophercook7-maker.github.io/property-hunter/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tophercook7-maker.github.io/property-hunter/share.png">
<link rel="canonical" href="https://tophercook7-maker.github.io/property-hunter/divestitures.html">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="ph.css">
<style>
main{max-width:1100px;margin:0 auto;padding:16px 16px 60px;display:grid;gap:20px}
h2{font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:0}
.lead{margin:2px 0 0;font-size:14px;color:var(--muted);max-width:75ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--rule);padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-weight:600}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr:hover td{background:var(--surface2)}
.note{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);padding:10px 12px;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--rule);padding:18px;font-size:14px;color:var(--muted)}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-size:15px}
.chip{display:inline-block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--rule);padding:1px 5px;margin-left:5px;color:var(--muted)}
</style>
</head>
<body>
<header class="ph-top"><h1><small>Institutional landowners · all 75 counties</small>Big land on the move</h1><nav data-nav aria-label="Sections"></nav></header>
<main>
  <section>
    <h2>Big land on the move</h2>
    <p class="lead" id="lead">Loading…</p>
    <div class="stats" id="stats"></div>
  </section>

  <section>
    <h2>What has moved</h2>
    <p class="lead" id="movelead"></p>
    <div id="moves"></div>
  </section>

  <section>
    <h2>Who is being watched</h2>
    <p class="lead">An entity holding at least 50 parcels across two or more counties. Ranked by parcel count.</p>
    <div class="tablewrap"><table><thead><tr>
      <th>#</th><th>Holder</th><th class="num">Parcels</th><th class="num">Counties</th><th class="num">Acres</th><th class="num">Appraised</th>
    </tr></thead><tbody id="holders"></tbody></table></div>
  </section>

  <section><div class="note" id="method"></div></section>
  <section id="means"></section>
</main>
<script src="nav.js"></script>
<script src="analytics.js"></script>
<script src="ph.js"></script>
<script>
const $ = id => document.getElementById(id);
const n = v => (v === null || v === undefined) ? '—' : Number(v).toLocaleString();
const money = v => (v === null || v === undefined) ? '—' : '$' + Math.round(v).toLocaleString();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stat = (b, s) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`;

fetch('data/divestitures.json').then(r => r.json()).then(d => {
  const t = d.totals;
  $('lead').textContent = d.what;
  $('stats').innerHTML =
    stat(n(t.holders_watched), 'Holders watched') +
    stat(n(t.parcels_held), 'Parcels they hold') +
    stat(n(t.acres_held), 'Acres under watch') +
    stat(money(t.appraised_held), 'Appraised value held') +
    stat(n(t.moves), 'Moves since ' + esc(d.baseline));

  if (!d.moves.length) {
    $('movelead').textContent = '';
    $('moves').innerHTML = `<div class="empty"><b>Nothing has left an institutional holder since ${esc(d.baseline)}.</b>` +
      `${esc(d.baseline_note)}</div>`;
  } else {
    $('movelead').textContent = `${d.moves.length} parcel${d.moves.length === 1 ? '' : 's'} have changed hands out of institutional ownership.`;
    $('moves').innerHTML = `<div class="tablewrap"><table><thead><tr>
      <th>Seen</th><th>County</th><th>Parcel</th><th>Left</th><th>Went to</th><th class="num">Acres</th><th class="num">Appraised</th>
      </tr></thead><tbody>` + d.moves.map(m =>
      `<tr><td>${esc(m.at)}</td><td>${esc(m.county)}</td>` +
      `<td><a href="lookup.html?parcel=${encodeURIComponent(m.parcel_id || '')}&county=${encodeURIComponent(m.county_fips || '')}">${esc(m.address || m.parcel_id || 'parcel')}</a></td>` +
      `<td>${esc(m.from)}</td><td>${esc(m.to)}</td>` +
      `<td class="num">${m.acreage ? Number(m.acreage).toLocaleString(undefined,{maximumFractionDigits:1}) : '—'}</td>` +
      `<td class="num">${money(m.appraised)}</td></tr>`).join('') + '</tbody></table></div>';
  }

  $('holders').innerHTML = d.top_holders.map((h, i) =>
    `<tr><td class="num">${i + 1}</td><td>${esc(h.owner)}${h.counties > 10 ? '<span class="chip">statewide</span>' : ''}</td>` +
    `<td class="num">${n(h.parcels)}</td><td class="num">${n(h.counties)}</td>` +
    `<td class="num">${h.acres ? Math.round(h.acres).toLocaleString() : '—'}</td>` +
    `<td class="num">${money(h.appraised)}</td></tr>`).join('');

  $('method').innerHTML = `<b>How a move is decided.</b> ${esc(d.method_note)}`;

  if (window.PH && PH.means) {
    $('means').innerHTML = PH.means(
      ['Owner of record and parcel counts come from the State\'s republished county roll, with its own date',
       'A holder is an entity with 50+ parcels across two or more counties, derived from the roll rather than a hand-kept list',
       'A move is only counted when the buyer is genuinely a different owner, not the same holder respelled'],
      ['Owner of record is not clear title, and a change of owner is not proof of a sale — it can be a transfer, a merger or a correction',
       'Appraised value is the county\'s figure, not market value and not a price paid',
       'Acreage is the roll\'s figure and is blank or zero on many subdivision lots',
       'An empty list means nothing has moved since the baseline, not that nothing moves',
       'Nothing here is legal, tax, appraisal, title or investment advice']);
  }
}).catch(() => { $('lead').textContent = 'The divestiture file has not been built yet.'; });
</script>
</body>
</html>
